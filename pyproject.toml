[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beetrack"
version = "0.3.0"
description = "Track colour-marked honeybee workers in a petri-dish arena and quantify their visits to a queen cell."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=12",
    "opencv-python-headless>=4.8",
    "scipy>=1.10",
    "pydantic>=2.5",
    "pyyaml>=6",
    "typer>=0.9",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
sleap = ["h5py>=3.8"]
dev = ["pytest>=7", "httpx>=0.25", "h5py>=3.8", "playwright>=1.45", "pytest-playwright>=0.5"]

[project.scripts]
beetrack = "beetrack.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
beetrack = ["server/static/*", "server/static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["ui: browser tests (Playwright + Chromium); skip with -m 'not ui'"]
