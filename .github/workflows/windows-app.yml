# Builds the Windows app (installer + portable zip) and checks that it really works.
#   • pull requests that touch packaging → build + checks, files kept as a workflow artifact for 7 days
#   • a version tag (v0.3.0, …)          → build + checks + a GitHub Release with both files attached
# Free for public repositories (GitHub-hosted runners and release storage).
name: Windows app

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/windows-app.yml"
      - "src/beetrack/desktop.py"
      - "pyproject.toml"
  workflow_dispatch:

concurrency:                 # a new push to the same pull request cancels the older build
  group: windows-app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version (and check that the tag matches pyproject.toml)
        id: v
        shell: bash
        run: |
          V=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$V" ]]; then
            echo "::error::tag ${GITHUB_REF#refs/tags/} does not match the version in pyproject.toml ($V)"; exit 1
          fi

      - name: Install beetrack and build tools
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller pillow requests

      - name: Icon
        run: python -c "from PIL import Image; Image.open('packaging/beetrack.png').save('packaging/beetrack.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Bundle ffmpeg (LGPL build, so result videos are H.264 without extra installs)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-dl
          New-Item -ItemType Directory -Force build/ffmpeg | Out-Null
          Copy-Item (Get-ChildItem ffmpeg-dl -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName build/ffmpeg/
          Copy-Item (Get-ChildItem ffmpeg-dl -Recurse -Filter LICENSE.txt | Select-Object -First 1).FullName build/ffmpeg/FFMPEG-LICENSE.txt
          build/ffmpeg/ffmpeg.exe -hide_banner -encoders | Select-String "h264"

      - name: Build the app (PyInstaller)
        run: pyinstaller packaging/beetrack.spec --noconfirm --distpath dist --workpath build/pyi

      - name: Check the app works (start, analyse, render)
        run: python packaging/smoke_test.py dist/beetrack/beetrack.exe

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist/beetrack -DestinationPath "dist/beetrack-portable-${{ steps.v.outputs.version }}-windows.zip"

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $env:BEETRACK_VERSION = "${{ steps.v.outputs.version }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\beetrack.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check the installer (silent install, then run the installed app)
        shell: pwsh
        run: |
          Start-Process -Wait "dist\beetrack-setup-${{ steps.v.outputs.version }}.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/CURRENTUSER","/NORESTART"
          $exe = "$env:LOCALAPPDATA\Programs\beetrack\beetrack.exe"
          if (-not (Test-Path $exe)) { Write-Error "not installed at $exe"; exit 1 }
          python packaging/smoke_test.py $exe 8766
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Keep the files (7 days)
        uses: actions/upload-artifact@v4
        with:
          name: beetrack-windows-${{ steps.v.outputs.version }}
          path: |
            dist/beetrack-setup-*.exe
            dist/beetrack-portable-*.zip
          retention-days: 7

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/beetrack-setup-*.exe dist/beetrack-portable-*.zip \
            --title "beetrack $GITHUB_REF_NAME" --notes-file packaging/RELEASE_NOTES.md
