# Runs the test suite once per pull request (not again after merging). Free for public repositories,
# and it never blocks a merge: it only reports a ✓ or ✗ on the pull request.
name: Tests

on:
  pull_request:
    paths-ignore:            # documentation-only changes don't need the tests
      - "**.md"
      - "docs/**"
      - "packaging/RELEASE_NOTES.md"
      - "LICENSE"

concurrency:                 # a new push to the same pull request cancels the older run
  group: tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          playwright install --with-deps chromium
      - name: Tests (pipeline, API and the web app in a browser)
        run: pytest
